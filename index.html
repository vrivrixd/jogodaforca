<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hangman</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <h1>Hangman</h1>
        <h2>Created by Vrivri</h2>
        <p>This is a simplified version of the Telegram bot of the same name.</p>
        <p><a href="https://t.me/forcavoxbot" target="_blank">Play with the bot</a></p>
        <p><a href="https://github.com/vrivrixd/jogodaforca" target="_blank">Source code on GitHub</a></p>

        <h2>Current Game</h2>
        <div id="game-section">
            <div id="game-active" class="hidden">
                <h2>Correct Letters</h2>
                <p id="correct-count">0</p>
                <h2>Wrong Letters</h2>
                <p id="wrong-count">0</p>
                <h2>Current Word</h2>
                <p id="word-display"></p>
                <input type="text" id="letter-input" maxlength="5" placeholder="Type a letter..." aria-label="Type a letter">
                <button id="guess-button">Submit</button>
                <div class="sound-toggle">
                    <input type="checkbox" id="sound-toggle" checked aria-label="Turn sounds on or off">
                </div>
            </div>
        </div>
        <p id="no-game-message">No game in progress.</p>
        <button id="new-game-button">New Game</button>
        <div id="end-message" class="hidden"></div>
        <div id="notification" class="notification hidden" role="alert" aria-live="polite"></div>
    </div>
    <script src="script.js"></script>
</body>
</html>
